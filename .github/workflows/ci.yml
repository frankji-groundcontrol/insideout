name: ci

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # rv4-PM-02: weekly, so a clock-pinned or order-dependent test cannot sit
    # red between pushes. Off the :00 mark, where scheduled runs queue.
    - cron: "41 3 * * 1"

concurrency:
  # rv4-TEST-08: a newer push supersedes an older pull request run only; a main
  # or scheduled run is the one verdict on its commit, so it finishes. It also
  # gets a group of its own: a run waiting behind another in a shared group is
  # replaced when a third is queued, cancel-in-progress or not.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read # rv4-PUB-07: least privilege; a job that needs more asks at job level

jobs:
  server:
    name: server (go + postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      # TEST-17: the minor is pinned so a Postgres release cannot change this
      # job under us; bump it on purpose. docker-compose.yml stays on the
      # floating postgres:18, the self-hosted default.
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # A second cluster that never gets the two roles: the roleless setup
      # scenarios create and drop insideout_owner and insideout_app themselves,
      # so they cannot share the cluster above.
      postgres-roleless:
        image: postgres:18.6
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://insideout_app:ci-app-password@localhost:5432/postgres
      DATABASE_OWNER_URL: postgres://insideout_owner:ci-owner-password@localhost:5432/postgres
      INSIDEOUT_JWT_SECRET: ci-only-secret-not-used-anywhere-else-32
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      # rv4-PM-10: fails when go.mod or go.sum is not what `go mod tidy` writes
      # (a direct dependency marked indirect was the case that got through).
      - name: go.mod and go.sum are tidy
        run: go mod tidy -diff
      # Mirror docker/postgres-init/001-create-app-role.sh: the app role is
      # RLS-subject, the owner role owns the insideout schema. Throwaway
      # passwords — this database lives only for this job run.
      - name: Create the two database roles
        run: |
          psql postgres://postgres:postgres@localhost:5432/postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE insideout_owner LOGIN NOSUPERUSER BYPASSRLS PASSWORD 'ci-owner-password';
          CREATE ROLE insideout_app LOGIN NOSUPERUSER NOBYPASSRLS PASSWORD 'ci-app-password';
          ALTER DATABASE postgres OWNER TO insideout_owner;
          GRANT CONNECT ON DATABASE postgres TO insideout_app;
          REVOKE CREATE ON SCHEMA public FROM PUBLIC;
          REVOKE ALL ON SCHEMA public FROM insideout_app;
          SQL
      - name: Apply migrations
        run: go run ./cmd/insideout migrate
      - name: Build and vet
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; echo "::error::gofmt drift"; exit 1; }
          go build ./... && go vet ./...
      - name: Test (integration suite must run, not skip)
        env:
          # rv4-PM-02: only the weekly schedule shuffles; pushes and pull
          # requests keep the fixed order, so a failure replays as it ran.
          SHUFFLE: ${{ github.event_name == 'schedule' && '-shuffle=on' || '-shuffle=off' }}
        run: |
          set -o pipefail
          # TEST-12/REL-22: -race, because the suite owns the shared state the
          # detector is for (auth throttle, resend cooldown, presence, turn
          # locks, SSE writers). It needs cgo; the runner image has gcc.
          go test ./... -race -count=1 -v -timeout 20m "$SHUFFLE" 2>&1 | tee /tmp/gotest.log
          # TEST-02/TEST-09: a skipped test anywhere — store, api, agent — is
          # a red build: every DATABASE_URL-gated test skips itself when the
          # variable is unset, and the postgres service above is the point of
          # this job. The one named exception needs a real terminal, which a
          # runner does not have (drive it with a pty, see its doc comment).
          unexpected=$(grep -E -- '--- SKIP: ' /tmp/gotest.log \
            | grep -v -E -- '--- SKIP: TestReadSecretTerminal ' || true)
          if [ -n "$unexpected" ]; then
            echo "::error::unexpected skipped test(s) — DATABASE_URL is not reaching the suite"
            echo "$unexpected"
            exit 1
          fi
      # TEST-17: the -v log is the evidence for a red run or a skip-gate trip.
      - name: Keep the test log
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gotest-log
          path: /tmp/gotest.log
          retention-days: 7
      # The build tag keeps these out of the run above. They drive `setup
      # --local --postgres own` against a cluster with no roles: provisioning,
      # the stop paths, and that no password or DSN is printed.
      - name: Setup scenarios on a cluster with no roles
        env:
          INSIDEOUT_ROLELESS_URL: postgres://postgres:postgres@localhost:5433/postgres?sslmode=disable
        run: go test -tags roleless ./cmd/insideout/ -run Roleless -count=1 -v -timeout 10m

  # TEST-01 (review-3): every other lane migrates a fresh empty database, so
  # the post-2026-10-08 migrations (RLS policy rewrites, the short invite-code
  # rotation) first meet real rows when the hosted stack deploys. This job
  # replays only the deployed schema, loads the pinned old-shape seed
  # (server/scripts/upgrade-seed.sql), migrates to HEAD through the server's
  # own runner, then smokes the result: the upgrade path runs against
  # production-shaped data before production ever sees it.
  upgrade-replay:
    name: upgrade replay (deployed schema + seed, migrate, smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6 # same pin as the server job
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://insideout_app:ci-app-password@localhost:5432/postgres
      DATABASE_OWNER_URL: postgres://insideout_owner:ci-owner-password@localhost:5432/postgres
      INSIDEOUT_JWT_SECRET: ci-only-secret-not-used-anywhere-else-32
      SMOKE_SERVER_LOG: /tmp/smoke-server.log
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      # Same two-role setup as the server job above. Throwaway passwords;
      # this database lives only for this run.
      - name: Create the two database roles
        run: |
          psql postgres://postgres:postgres@localhost:5432/postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE insideout_owner LOGIN NOSUPERUSER BYPASSRLS PASSWORD 'ci-owner-password';
          CREATE ROLE insideout_app LOGIN NOSUPERUSER NOBYPASSRLS PASSWORD 'ci-app-password';
          ALTER DATABASE postgres OWNER TO insideout_owner;
          GRANT CONNECT ON DATABASE postgres TO insideout_app;
          REVOKE CREATE ON SCHEMA public FROM PUBLIC;
          REVOKE ALL ON SCHEMA public FROM insideout_app;
          SQL
      - name: Replay the deployed schema, seed old data, migrate to HEAD
        run: ./scripts/upgrade-replay.sh
      # A replayed database is invitation-only like production; smoke.sh
      # registers its own users, so open signup on this throwaway one.
      - name: Open signup on the throwaway database
        run: |
          psql "$DATABASE_OWNER_URL" -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO insideout.settings (key, value) VALUES ('signup_mode', '"open"')
          ON CONFLICT (key) DO UPDATE SET value = excluded.value, updated_at = now();
          SQL
      - name: Smoke
        run: ./scripts/smoke.sh
      - name: Keep the smoke server log
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: upgrade-replay-smoke-server-log
          path: /tmp/smoke-server.log
          if-no-files-found: ignore
          retention-days: 7

  # Review-3 ARCH-01: go.mod's floor moved to 1.26.0 while the Dockerfile
  # stayed on golang:1.25 and no lane noticed — the image build is the only
  # place that toolchain mismatch can surface. CI must certify the toolchain
  # that builds the shipped server image, same principle as the client pin
  # in the flutter job below.
  server-image:
    name: server image (docker build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: docker build -t insideout-server-ci server/

  # BUG-027: the app's nginx must follow its API upstream when DNS changes, and
  # only a real nginx shows that. The distro package is older than the image's
  # 1.27 but has every directive client/nginx.conf uses. SEC-12: the same real
  # nginx is the only way to see the security headers it sends.
  nginx:
    name: app nginx (re-resolve)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq nginx
      - run: python3 -I scripts/check_nginx_reresolve.py
      - run: python3 -I scripts/check_nginx_headers.py
      - run: python3 -I scripts/check_nginx_webhook_body.py

  client:
    name: client (flutter)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          # Keep in lockstep with client/Dockerfile — CI must certify the
          # toolchain that builds the shipped web image (ARCH-01).
          flutter-version: 3.44.0
          channel: stable
          cache: true
      # --enforce-lockfile: fail on a lock written under another SDK instead of
      # silently re-resolving it (3.47 and 3.44 pin different SDK packages).
      - run: flutter pub get --enforce-lockfile
      # Infos are the accepted baseline (see docs/plans board) but the count
      # only goes down: warnings and errors stay fatal in the analyzer itself,
      # and this step fails once the infos pass INFO_BASELINE (TEST-14). Lower
      # the number whenever infos are fixed; never raise it. rv4-PM-07: 14 is
      # what the pinned 3.44 prints; check_ci_gates.py holds the ceiling.
      - name: Analyze (info count may not grow)
        shell: bash # pipefail on, so an analyzer failure is not hidden by tee
        env:
          INFO_BASELINE: "14"
        run: |
          flutter analyze --no-fatal-infos | tee /tmp/analyze.log
          infos=$(grep -c -E '^ +info • ' /tmp/analyze.log || true)
          echo "analyzer infos: $infos (baseline $INFO_BASELINE)"
          if [ "$infos" -gt "$INFO_BASELINE" ]; then
            echo "::error::flutter analyze reports $infos infos, past the baseline of $INFO_BASELINE; fix the new ones"
            exit 1
          fi
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter test
      # TEST-11: behavior-test the web-only conditional imports in the
      # browser — the VM suite above cannot load them (its collector drops
      # @TestOn('browser') suites, so that run stays unchanged) and the
      # build below only compiles them. The lane needs the runner image's
      # preinstalled Chrome.
      - run: flutter test --platform chrome test/web
      # The web target is the production surface, and VM tests can't see
      # web-only conditional imports (they broke exactly this way once).
      - run: flutter build web --release --no-web-resources-cdn --dart-define=API_BASE=/api/v1

  android:
    name: android (flutter apk)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          # Same pin as the client job and client/Dockerfile.
          flutter-version: 3.44.0
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      # The release build type signs with the debug keys
      # (client/android/app/build.gradle.kts), so this needs no keystore. A
      # store-signed bundle stays an owner step.
      # Gradle fetches its plugins from plugins.gradle.org, which now and then
      # serves a truncated POM; one retry resumes from what is already cached.
      - run: |
          build() { flutter build apk --release --dart-define=API_BASE=https://insideout.yalotein.net/api/v1; }
          build || { echo "::warning::retrying the APK build once (dependency fetch)"; sleep 15; build; }

  env-suites:
    name: env catalog suites (python)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: scripts
    steps:
      # rv4-PM-01: check_docs_truth.py lists v* tags and a default checkout has none.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-tags: true
      # TEST-17: a pinned interpreter instead of whatever python3 the runner
      # image ships (the scripts target 3.9 or newer).
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: env batteries + key suites
        run: |
          # The two env batteries are plain-assert scripts that exit at import
          # (env_testlib.run), so `unittest test_env_catalog test_env_writes`
          # stopped after the first and never ran the second.
          python3 test_env_catalog.py
          python3 test_env_writes.py
          python3 -m unittest discover -s tests/keys -t . -p "test_*.py" -v
      # SEC-14: blocks here; the pre-commit hook only warns. The script finds
      # the repo root itself, so the job's scripts/ working directory is fine.
      - name: redaction guard
        run: sh check-redaction.sh
      # rv4-PM-01: the contract guards ran by hand only. The glob takes the next
      # guard without an edit here; the repo root, not the job's scripts/ default.
      - name: contract guards (scripts/tests/check_*.py)
        working-directory: .
        run: |
          status=0
          for f in scripts/tests/check_*.py; do
            python3 -I "$f" || { echo "::error file=$f::contract guard failed"; status=1; }
          done
          exit "$status"
