name: smoke

# TEST-10: the live five-surface check (server/scripts/smoke.sh: coach SSE, AI
# roadmap, GitHub sync, project updates, cross-tenant authz) ran nowhere on a
# schedule. It runs nightly and on demand, never on a pull request: it boots a
# server and reaches GitHub's public API once. Scheduled runs use the default
# branch; a red one is a real signal (GitHub 429/404/502 is tolerated by S3).
#
# TEST-03: the five surfaces boot their own throwaway server, so the nightly
# could stay green while the public deployment is broken. The hosted mode
# (dispatchable, and on the nightly schedule with it) runs smoke.sh against
# the public URL in read-only probe mode: the SPA entry page, healthz, the
# auth config, an unauthenticated 401, and an authenticated /me when
# INSIDEOUT_TOKEN is configured — a missing secret skips, never fails.

on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "dev = the five-surface suite on a throwaway database; hosted = read-only probes of the public deployment"
        type: choice
        options:
          - dev
          - hosted
        default: dev

permissions:
  contents: read

jobs:
  smoke:
    name: live smoke (go + postgres)
    # TEST-03: the hosted dispatch mode runs the hosted-smoke job below
    # instead of this one; scheduled runs (empty inputs.mode) stay here.
    if: inputs.mode != 'hosted'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6 # same pin as ci.yml
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://insideout_app:ci-app-password@localhost:5432/postgres
      DATABASE_OWNER_URL: postgres://insideout_owner:ci-owner-password@localhost:5432/postgres
      INSIDEOUT_JWT_SECRET: ci-only-secret-not-used-anywhere-else-32
      # smoke.sh clears INSIDEOUT_LLM_API_KEY per-command on the server it
      # boots, so the five surfaces keep the offline template coach/planner;
      # the provider legs use the real keys when they are configured as repo
      # secrets and print a skip line otherwise (TEST-05) — a missing secret
      # is never a failure. SMOKE_MAIL_TO is the Resend-verified sink address
      # the mail probe sends to (the default sender delivers to nothing
      # else). It keeps the server's boot log here.
      SMOKE_SERVER_LOG: /tmp/smoke-server.log
      INSIDEOUT_LLM_API_KEY: ${{ secrets.INSIDEOUT_LLM_API_KEY }}
      INSIDEOUT_MAIL_API_KEY: ${{ secrets.INSIDEOUT_MAIL_API_KEY }}
      SMOKE_MAIL_TO: ${{ secrets.SMOKE_MAIL_TO }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      # Same two-role setup as the server job in ci.yml. Throwaway passwords;
      # this database lives only for this run.
      - name: Create the two database roles
        run: |
          psql postgres://postgres:postgres@localhost:5432/postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE insideout_owner LOGIN NOSUPERUSER BYPASSRLS PASSWORD 'ci-owner-password';
          CREATE ROLE insideout_app LOGIN NOSUPERUSER NOBYPASSRLS PASSWORD 'ci-app-password';
          ALTER DATABASE postgres OWNER TO insideout_owner;
          GRANT CONNECT ON DATABASE postgres TO insideout_app;
          REVOKE CREATE ON SCHEMA public FROM PUBLIC;
          REVOKE ALL ON SCHEMA public FROM insideout_app;
          SQL
      - name: Apply migrations
        working-directory: server
        run: go run ./cmd/insideout migrate
      # A fresh database is invitation-only and smoke.sh registers its own
      # users, so open signup on this throwaway one.
      - name: Open signup on the throwaway database
        run: |
          psql "$DATABASE_OWNER_URL" -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO insideout.settings (key, value) VALUES ('signup_mode', '"open"')
          ON CONFLICT (key) DO UPDATE SET value = excluded.value, updated_at = now();
          SQL
      - name: Smoke
        run: ./server/scripts/smoke.sh
      - name: Keep the server log
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: smoke-server-log
          path: /tmp/smoke-server.log
          if-no-files-found: ignore
          retention-days: 7

  # TEST-03: read-only probes of the public deployment — the lane that
  # fails first when the hosted stack breaks (a missing client image, a
  # broken nginx upstream, a mis-set env var). No database and no writes:
  # smoke.sh in SMOKE_HOSTED mode registers no users. The authenticated
  # /me probe runs only when INSIDEOUT_TOKEN (the CLI's session env) is
  # configured as a repo secret; without it the probe prints a skip line,
  # so a missing secret never fails this job. The origin is
  # apiclient.DefaultBase's host; scripts/tests/check_smoke_wiring.py
  # pins the two together.
  hosted-smoke:
    name: hosted smoke (read-only probes, public deployment)
    if: github.event_name == 'schedule' || inputs.mode == 'hosted'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SMOKE_BASE: https://insideout.yalotein.net
      SMOKE_HOSTED: "1"
      INSIDEOUT_TOKEN: ${{ secrets.INSIDEOUT_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Probe the public deployment
        run: ./server/scripts/smoke.sh
