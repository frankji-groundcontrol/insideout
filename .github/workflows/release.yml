name: release

# A `v*` tag push builds and publishes the four binary archives. What stands
# between the tag and the published release (rv4-PUB-03, SEC-07), in order:
#   1. Gate: the tagged commit is reachable from the default branch AND the
#      `ci` workflow finished green for exactly that SHA. ci.yml is the only
#      place the DATABASE_URL-gated suites run (this job has no Postgres
#      service), so a green ci run on the tag SHA is the evidence that they
#      passed. Tag the tip commit ci ran on; a tag on a branch-only or
#      never-tested commit stops here. Fails closed on any API error.
#   2. go test -race, then build, tar and checksum the four targets.
#   3. A signed build-provenance attestation for every archive, so a download
#      can be verified against this repository and this workflow
#      (`gh attestation verify <file> --repo <owner>/<repo>`), not only against
#      a checksum that ships from the same origin as the archive.
#   4. `gh release create --verify-tag`: no --clobber and no upload-over, so a
#      published release is never rewritten. A bad release is superseded by a
#      new tag; if a run dies after the draft was created, delete that draft
#      before re-running the job. Full runbook: docs/usage/releasing.md.
# CI-config file: the first real proof is the first tag run after this lands.

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  # Publishing must not be cancelled mid-flight; a re-run of the same tag
  # queues behind the in-progress one. It cannot repair a published release:
  # gh release create refuses a tag that already has one.
  cancel-in-progress: false

# Least privilege by default; the release job asks for what it needs below.
permissions:
  contents: read

jobs:
  release:
    name: release (build + publish)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read # the gate lists the ci runs of the tagged SHA
      contents: write # gh release create
      id-token: write # OIDC identity the attestation is signed with
      attestations: write # store the attestation
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the gate asks git whether the tag is on the default branch.
          fetch-depth: 0
          persist-credentials: false
      - name: Gate, the tag is on the default branch and ci is green for its SHA
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse "refs/tags/${GITHUB_REF_NAME}^{commit}")
          if ! git merge-base --is-ancestor "$sha" "origin/${DEFAULT_BRANCH}"; then
            echo "::error::${GITHUB_REF_NAME} (${sha}) is not on ${DEFAULT_BRANCH}; tag a commit that is"
            exit 1
          fi
          # status=success matches the run conclusion. Any API error aborts
          # (set -e) and a non-number fails the test below: it cannot fail open.
          ok=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${sha}&status=success&per_page=1" --jq '.total_count')
          [ "$ok" -ge 1 ] || {
            echo "::error::no successful ci run for ${sha}; wait for ci on that commit, or tag the commit it ran on"
            exit 1
          }
          echo "==> ${GITHUB_REF_NAME} is ${sha}, on ${DEFAULT_BRANCH}, ci green"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Test with the race detector before anything is built or published
        # Fails closed: a red test stops the release. The DATABASE_URL-gated
        # suites skip on this runner; the gate above proved they ran green
        # in ci.yml on this exact commit.
        run: go test ./... -race -count=1
      - name: Build, tar, and checksum the four targets
        run: |
          set -euo pipefail
          dist="$GITHUB_WORKSPACE/dist"
          mkdir -p "$dist"
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${target%/*}
            arch=${target#*/}
            # CGO is off per build: the amd64-linux runner cannot
            # cross-link cgo for the other three targets.
            # The tag is the version `insideout version` reports.
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch \
              go build -ldflags "-X main.version=${GITHUB_REF_NAME}" \
                -o "build/$os-$arch/insideout" ./cmd/insideout
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch \
              go build -o "build/$os-$arch/insideout-mcp" ./cmd/insideout-mcp
            # Both binaries sit at the top level of the archive, where
            # scripts/bootstrap.sh extracts them from (it installs only
            # those two). The license, the third-party notices and the MPL-2.0
            # section 3.2 source offer travel in the same archive (PUB-04).
            tar -czf "$dist/insideout-$os-$arch.tar.gz" \
              -C "build/$os-$arch" insideout insideout-mcp \
              -C "$GITHUB_WORKSPACE" LICENSE THIRD_PARTY_NOTICES.md
          done
          (cd "$dist" && sha256sum insideout-*.tar.gz > checksums.txt)
          # Ship the installer with the release so
          # curl -fsSL .../releases/latest/download/bootstrap.sh | bash
          # always fetches the bootstrap that matches these assets.
          cp "$GITHUB_WORKSPACE/scripts/bootstrap.sh" "$dist"/
          ls -l "$dist"
      # After the build and before the publish: nothing unattested is released.
      - name: Attest the build provenance of every release asset
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ github.workspace }}/dist/*
      - name: Publish the GitHub release (never overwrites)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          dist="$GITHUB_WORKSPACE/dist"
          # --verify-tag aborts unless the tag already exists on the remote
          # (it does: it triggered this run) instead of creating one from the
          # default branch tip. An existing release for the tag is an error.
          gh release create "$GITHUB_REF_NAME" "$dist"/* \
            --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
