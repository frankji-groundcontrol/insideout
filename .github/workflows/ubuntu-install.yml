name: ubuntu install skill

# Runs the install skill's own Ubuntu commands (skills/insideout-setup) on a
# real Ubuntu 24.04 VM, so the skill is proven on the platform it names and
# cannot drift from what runs. Docker and Flutter are only checked for
# availability: the runner ships Docker CE (installing docker.io beside it
# would break the daemon) and the Flutter archive is ~700 MB.
# Record: docs/issues/2026-10-06-install-skill-ubuntu-unverified.md

on:
  push:
    branches: [main]
    paths:
      - skills/insideout-setup/**
      - scripts/install.sh
      - scripts/default-api.sh
      - scripts/tests/skill_blocks.py
      - .github/workflows/ubuntu-install.yml
  pull_request:
    paths:
      - skills/insideout-setup/**
      - scripts/install.sh
      - scripts/default-api.sh
      - scripts/tests/skill_blocks.py
      - .github/workflows/ubuntu-install.yml
  workflow_dispatch:

concurrency:
  group: ubuntu-install-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ubuntu:
    name: install skill (ubuntu 24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Step 0, platform
        run: |
          . /etc/os-release
          echo "$PRETTY_NAME $(uname -m)"
          test "$ID" = ubuntu

      # Each block is captured into a variable first. Inside "$(...)" in the -c
      # argument a failing helper (a renamed heading in modules.md) hands bash
      # an empty script, which exits 0, and the step would pass without ever
      # running the skill.
      - name: Module 1, base tools (the skill's Ubuntu block)
        run: |
          blocks=$(python3 -I scripts/tests/skill_blocks.py 1)
          bash -euo pipefail -c "$blocks"
          git --version && curl --version | head -1 && jq --version && python3 --version && openssl version

      # A clean PATH, so a Go already on the runner cannot satisfy the verify
      # step: it must be the tarball the skill installs.
      - name: Module 3, Go 1.26+ (the skill's Ubuntu block)
        run: |
          blocks=$(python3 -I scripts/tests/skill_blocks.py 3)
          env -i HOME="$HOME" PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            bash -euo pipefail -c "$blocks
          go version | tee /dev/stderr | grep -E 'go1\.(2[6-9]|[3-9][0-9])'"
          echo /usr/local/go/bin >> "$GITHUB_PATH"

      - name: Module 4, the Docker packages the skill names exist on 24.04
        run: |
          sudo apt-get update -qq
          for p in docker.io docker-compose-v2; do
            apt-cache policy "$p" | grep -E '^ +Candidate: [0-9]' \
              || { echo "::error::$p has no candidate on this Ubuntu"; exit 1; }
          done

      - name: Module 5, PostgreSQL (the skill's Ubuntu block)
        run: |
          blocks=$(python3 -I scripts/tests/skill_blocks.py 5)
          bash -euo pipefail -c "$blocks"
          psql --version
          pg_lsclusters
          pg_lsclusters | grep -q online

      # Keep the version in lockstep with the Flutter pin in ci.yml.
      # No pipe after curl: the default step shell is "bash -e" without
      # pipefail, so a 404 in front of "| head" would still pass.
      - name: Module 6, the pinned Flutter archive the skill names exists
        run: |
          curl -fsSIL -o /dev/null -w 'HTTP %{http_code}\n' "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.44.0-stable.tar.xz"

      # A clean PATH again: the runner already has ~/.local/bin on it, which
      # would send install.sh down its "already on PATH" branch and skip the
      # rc-file edit a fresh Ubuntu user relies on.
      - name: Step 3A, install.sh builds both binaries and puts them on PATH
        run: |
          env -i HOME="$HOME" SHELL=/bin/bash \
            PATH=/usr/local/go/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            ./scripts/install.sh
          grep -q 'added by insideout installer' "$HOME/.bashrc"
          # A new interactive shell (the rc file returns early otherwise) finds both binaries.
          for b in insideout insideout-mcp; do
            found=$(env -i HOME="$HOME" PATH=/usr/bin:/bin bash -ic "command -v $b" 2>/dev/null)
            test "$found" = "$HOME/.local/bin/$b" || { echo "::error::new shell resolves $b to '$found'"; exit 1; }
          done
          export PATH="$HOME/.local/bin:$PATH"
          insideout setup --hosted </dev/null
          # A closed port proves the Linux binary runs and reaches its HTTP
          # client without calling the hosted API from CI.
          out=$(INSIDEOUT_API=http://127.0.0.1:9 insideout whoami 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q 'connection refused'
