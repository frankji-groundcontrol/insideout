# SEC-12: security headers. The web client keeps a 720-hour refresh token in the
# browser, so one injected script would be a persistent takeover; the CSP
# below is the backstop. HSTS comes from the https the edge terminates: nginx
# itself only sees http behind it, so the header keys off the X-Forwarded-Proto
# the edge sets, and an empty value makes nginx drop the header (plain-http
# dev stays free of it). The map is top-level because this template is
# included inside http.
map $http_x_forwarded_proto $hsts {
    https "max-age=31536000; includeSubDomains";
    default "";
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    # application/wasm: the image bundles CanvasKit (rv4-COMP-03), a 5.7 MB wasm
    # that the CDN used to compress; the fonts under /fonts/ are woff2 already.
    gzip_types text/plain text/css application/javascript application/json application/wasm;

    # `always` puts them on error pages too. Keep every add_header here, at
    # server level: one inside a location replaces this whole set for that
    # location. scripts/check_nginx_headers.py checks the result on a real
    # nginx. The CSP is one line (nginx keeps a newline in the header value).
    # rv4-COMP-03: everything comes from this origin. The image builds with
    # --no-web-resources-cdn, so canvaskit/ ships in build/web; index.html
    # links no stylesheet; web/flutter_bootstrap.js points the engine's font
    # downloads (fetch, so connect-src) at /fonts/s/, where every file it can
    # ask for is mirrored. 'unsafe-inline' is for the <style> elements the
    # engine injects. Loosen it only for what the console reports.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    add_header Strict-Transport-Security $hsts always;

    location /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    # The upstream is envsubst'd at container start: this file ships as
    # /etc/nginx/templates/default.conf.template and NGINX_API_UPSTREAM
    # defaults to the Railway private hostname (baked in the Dockerfile);
    # docker-compose overrides it to the `server` service. See finding
    # FS-06 in docs/review/2026-10-04-multirole/.
    #
    # BUG-027: `proxy_pass http://host/...` resolves the host once, when nginx
    # loads this file, so a redeployed `server` (new private address) left
    # every /api/ call failing until `app` restarted, and an upstream name that
    # did not resolve yet kept nginx from starting at all. Going through a
    # variable makes nginx resolve per request, with the container's own
    # resolvers (NGINX_LOCAL_RESOLVERS, which the image entrypoint exports
    # because the Dockerfile sets NGINX_ENTRYPOINT_LOCAL_RESOLVERS) and an
    # answer cached for 10s. NGINX_API_UPSTREAM must be scheme://host:port with
    # no path: with a variable and no URI, nginx forwards the request URI as the
    # client sent it. Check it with scripts/check_nginx_reresolve.py.
    resolver ${NGINX_LOCAL_RESOLVERS} valid=10s;

    # The GitHub webhook: the server caps this route at 8 MiB
    # (maxWebhookBodyBytes, server/internal/api/middleware.go) because a
    # push delivery with many commits outgrows 1 MiB, while nginx's own
    # client_max_body_size default is 1 MiB and would answer 413 before
    # the server ever saw the body. An exact-match location wins over the
    # /api/ prefix below and carries its proxy directives verbatim — the
    # set + variable proxy_pass (BUG-027), which `set` does NOT inherit
    # from the /api/ location, so it must be repeated here. Check it with
    # scripts/check_nginx_webhook_body.py.
    location = /api/v1/hooks/github {
        set $api_upstream ${NGINX_API_UPSTREAM};
        proxy_pass $api_upstream;
        client_max_body_size 8m;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Same ${NGINX_XFF} as /api/: hosted passes the edge's chain
        # through; compose ends it in the peer nginx saw.
        proxy_set_header X-Forwarded-For ${NGINX_XFF};
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Accept $http_accept;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location /api/ {
        set $api_upstream ${NGINX_API_UPSTREAM};
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # ${NGINX_XFF} is substituted at container start (envsubst). The
        # image default is $http_x_forwarded_for: on Railway the chain is
        # browser → edge → nginx → server, the edge already appended the
        # client, and a second append would make the rightmost entry the
        # shared edge address (REL-13). Compose overrides it with
        # $proxy_add_x_forwarded_for, so with nothing in front the rightmost
        # entry is the peer nginx saw and a client-written value stays left.
        proxy_set_header X-Forwarded-For ${NGINX_XFF};
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Accept $http_accept;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # The engine's fallback fonts, a byte copy of Google's static font host
    # (rv4-COMP-03). No SPA fallback here: a missing file must be a 404, or the
    # engine would hand index.html to its font parser and retry. No add_header
    # in this block (see the note on the headers above).
    location /fonts/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
