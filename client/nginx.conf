server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;

    location /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    # The upstream is envsubst'd at container start: this file ships as
    # /etc/nginx/templates/default.conf.template and NGINX_API_UPSTREAM
    # defaults to the Railway private hostname (baked in the Dockerfile);
    # docker-compose overrides it to the `server` service. See finding
    # FS-06 in docs/review/2026-10-04-multirole/.
    location /api/ {
        proxy_pass ${NGINX_API_UPSTREAM}/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Accept $http_accept;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
