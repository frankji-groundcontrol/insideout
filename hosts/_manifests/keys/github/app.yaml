schema_version: 1
module: github
setting: app
recorded: '2026-10-05'
# The GitHub App installation: identity + authenticating material.
secrets:
  gh-app-id: { var: INSIDEOUT_GH_APP_ID, kind: value, optional: true }
  gh-app-private-key:
    var: INSIDEOUT_GH_PRIVATE_KEY
    kind: value
    optional: true
    note: multi-line PEM; the server also accepts
      INSIDEOUT_GH_PRIVATE_KEY_FILE pointing at the .key itself
  gh-private-key-file:
    var: INSIDEOUT_GH_PRIVATE_KEY_FILE
    kind: path
    optional: true
    note: pointer to the canonical PEM .key above; blank = the
      env-embedded lane
