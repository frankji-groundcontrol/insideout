schema_version: 1
host: franks-macbook-pro.local
module: database
setting: supabase
recorded: '2026-10-05'
# The shared deployment Supabase: role-scoped DSNs consumed by the server
# and by migrations. Local .env points at the same instance. Metadata only —
# values live in .secrets/<name>.key, never in this file.
secrets:
  database-app-dsn:
    var: DATABASE_URL
    kind: value
    note: app role DSN
  database-owner-dsn:
    var: DATABASE_OWNER_URL
    kind: value
    note: schema-owner DSN used by migrations
