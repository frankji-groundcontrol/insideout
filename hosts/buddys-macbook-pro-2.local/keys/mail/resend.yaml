schema_version: 1
host: buddys-macbook-pro-2.local
module: mail
setting: resend
recorded: '2026-10-05'
# Resend key for transactional auth email. Empty selects mail dev mode
# (logged, not sent). Setting a key requires INSIDEOUT_PUBLIC_URL so
# emailed links never point at the localhost default. Metadata only —
# values live in .secrets/<name>.key, never in this file.
secrets:
  mail-api-key:
    var: INSIDEOUT_MAIL_API_KEY
    kind: value
    optional: true
    note: copied 2026-10-05 from the primary host's store; rotate if
      transcripts ever leave either machine.
  mail-from:
    var: INSIDEOUT_MAIL_FROM
    kind: value
    note: config companion; Resend-verified sender (catalog default is
      the sandbox sender)
  public-url:
    var: INSIDEOUT_PUBLIC_URL
    kind: value
    note: config companion; required the moment the mail key is set
      (fail-fast) so emailed links never point at the localhost default
