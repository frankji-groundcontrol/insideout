schema_version: 1
host: buddys-macbook-pro-2.local
module: llm
setting: provider
recorded: '2026-10-05'
# The PRD coach's model key. Empty selects the offline template-reply
# coach (a valid local-dev choice); this host keeps a real key in its
# .env. Metadata only — values live in .secrets/<name>.key.
secrets:
  llm-api-key:
    var: INSIDEOUT_LLM_API_KEY
    kind: value
    optional: true
    note: present in this machine's .env (offline coach when empty)
  llm-base-url:
    var: INSIDEOUT_LLM_BASE_URL
    kind: value
    note: config companion (catalog default exists); the four quartet
      values must agree — backed up here like agents_home model ids
  llm-model:
    var: INSIDEOUT_LLM_MODEL
    kind: value
    note: config companion (catalog default exists)
  llm-schema:
    var: INSIDEOUT_LLM_SCHEMA
    kind: value
    note: config companion; messages (Anthropic wire) or responses
      (OpenAI wire)
